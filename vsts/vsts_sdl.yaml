name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    exclude:
    - docs/*
    - tools/CaptureLogs/*
    - iothub/device/devdoc/*
    - iothub/service/devdoc/*

resources:
  - repo: self
    clean: true

jobs:
  ### .Net SDL Analyzers ###
  - job: DOTNet_SDL_Analyzers
    displayName: .Net SDL Analyzers
    condition: succeeded()
    # CodeQL traces the builds below, which roughly doubles their wall time.
    timeoutInMinutes: 90
    variables:
      # Owns the 'csharp' and 'java' CodeQL snapshots for this repo
      # (Microsoft.Security.CodeQL.10000). Declaring the tasks explicitly, rather
      # than leaning on the auto-injected CodeQL, keeps the snapshot S360 records
      # tied to this job -- the one that actually builds the product. S360 keeps
      # arg_max(SnapshotDate) per (repo, language), so without this the most
      # recent incidental attempt wins instead.
      # Only on main; this pipeline also runs on PRs, which need no snapshot.
      # See https://aka.ms/codeql3000 and https://aka.ms/sdlfaqcodeql.
      Codeql.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
      Codeql.Language: csharp,java
    pool:
      vmImage: windows-2022
    steps:
      - task: CodeQL3000Init@0
        displayName: Initialize CodeQL
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

      - powershell: .\build.ps1 -clean -build -configuration Debug -package
        displayName: Build Package

      # GitHub reports 'java' among this repo's languages because of testProxy/
      # (a single Main.java used by the E2E tests), so S360 grades us on it and
      # CodeQL needs a traced java build to produce that database.
      # testProxy/pom.xml sets maven.compiler.target=11, and the windows-2022
      # image defaults JAVA_HOME to JDK 8 ('invalid target release: 11'), so the
      # JDK has to be selected explicitly. Both steps run only on main, where
      # CodeQL is enabled -- PR builds should not pay for a java build.
      - task: JavaToolInstaller@0
        displayName: Use JDK 11 (for the test proxy build)
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        inputs:
          versionSpec: '11'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - powershell: mvn -f $(Build.SourcesDirectory)/testProxy/pom.xml clean install -q
        displayName: Build test proxy (java, for CodeQL)
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

      - task: CodeQL3000Finalize@0
        displayName: Finalize CodeQL
        condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

      - task: ComponentGovernanceComponentDetection@0
        displayName: "Component Detection"
      
      - task: securedevelopmentteam.vss-secure-development-tools.build-task-policheck.PoliCheck@2
        displayName: "Run PoliCheck"
        inputs:
          targetType: F
          optionsRulesDBPath: '$(Build.SourcesDirectory)\vsts\PolicheckExclusionsDB.mdb'
          optionsSEV: '1|2|3|4'
          optionsPE: 1
      
      - task: securedevelopmentteam.vss-secure-development-tools.build-task-antimalware.AntiMalware@4
        displayName: "Run MpCmdRun.exe"
        inputs:
          EnableServices: true
          SignatureFreshness: OneDay
          # Signature refreshes on Hosted Agents can sometimes have a delay of a day or two.
          # The support team already has a process to address this, so our pipeline can treat stale signatures as warnings (instead of treating it as an error).
          TreatStaleSignatureAs: Warning

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@3
        displayName: "Run BinSkim"
        inputs:
          arguments: 'analyze  $(Build.SourcesDirectory)\Microsoft.Azure.Devices.*.dll --recurse --verbose'

        # TODO #181 Config issue: must run on Debug builds only with valid PDBs.
        enabled: false

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-codemetrics.CodeMetrics@1
        displayName: "Run CodeMetrics"
        inputs:
          Files: '$(Build.SourcesDirectory)\**\Microsoft.Azure.Devices.*.dll'

        # TODO #181 Config issue: must run on Debug builds only with valid PDBs.
        enabled: false

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-credscan.CredScan@3
        displayName: "Run CredScan"
        inputs:
          toolMajorVersion: V2
          suppressionsFile: vsts/CredScanSuppressions.json
          regexMatchTimeoutInSeconds: 5

          # TODO #181 Samples / tests fail the test due to fake connection strings.
          debugMode: false

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
        displayName: "Publish Security Analysis Logs"

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-report.SdtReport@2
        displayName: "Create Security Analysis Report"
        inputs:
          AllTools: true
          
      - task: ComponentGovernanceComponentDetection@0
        displayName: Component Governance Detection
        inputs:
          scanType: 'Register'
          verbosity: 'Verbose'
          alertWarningLevel: 'Low' # The task will present a warning, but will not cause the build to fail
        condition: always()

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-uploadtotsa.TSAUpload@2
        displayName: 'TSA upload'
        inputs:
          GdnPublishTsaOnboard: false
          GdnPublishTsaConfigFile: '$(Build.SourcesDirectory)/vsts/TsaUploadConfigFile.json'
          GdnPublishTsaExportedResultsPublishable: true

      - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@1
        displayName: "Post Analysis"
        inputs:
          AllTools: true

        # TODO #181 Enable post analysis to break builds after all above items are enabled.
        enabled: false
